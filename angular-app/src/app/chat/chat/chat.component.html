<div class="chat-container">
  <div *ngFor="let msg of messages">
    <b>{{ msg.senderId }}:</b> {{ msg.body }}
  </div>

  <div class="input">
    <input [(ngModel)]="newMessage" placeholder="Escribe..." />
    <button (click)="sendMessage()">Enviar</button>
  </div>
</div>
<p>YO: {{ currentUserId }}</p>
<p>OTRO: {{ otherUserId }}</p>
<p>CONV: {{ conversationId }}</p>
