<div class="followers-page-wrapper">
  <div class="followers-card">
    <div class="followers-header">
      <button mat-icon-button (click)="goBack()" class="back-btn">
        <mat-icon>arrow_back</mat-icon>
      </button>
      <h2>Siguiendo de &#64;{{ username }}</h2>
    </div>

    @if (isLoading) {
      <div class="followers-loading">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else if (following.length === 0) {
      <div class="followers-empty">
        <mat-icon>people_outline</mat-icon>
        <p>Aún no sigue a nadie</p>
      </div>
    } @else {
      <div class="followers-list">
        @for (followed of following; track followed.id) {
          <button
            class="follower-item"
            (click)="goToProfile(followed.user.username, followed.user.id)"
          >
            <img
              class="follower-avatar"
              [src]="getPhotoUrl(followed.user.photoUrl)"
              [alt]="followed.user.username"
            />
            <div class="follower-info">
              <span class="follower-name">{{ followed.user.username }}</span>
              <span class="follower-handle">{{
                "@" + followed.user.username
              }}</span>
            </div>
          </button>
        }
      </div>
      <div class="followers-count">
        {{ following.length }}
        {{ following.length === 1 ? "usuario" : "usuarios" }} siguiendo
      </div>
    }
  </div>
</div>
