<div class="grid flex flex-column md:flex-row justify-content-center">
  <div class="col-12 md:col-3">
    <app-link-login-and-create-account></app-link-login-and-create-account>
    <app-navbar-page></app-navbar-page>
  </div>

  <div class="col-12 md:col-9 flex flex-column">
    <app-upload-content-page></app-upload-content-page>
    <div class="whatsapp-layout">
      <div class="conversations-panel">
        <div class="conversations-header">
          <h3>Mensajes</h3>
        </div>

        <div
          *ngFor="let conv of conversations"
          class="conversation-item"
          [class.active]="
            selectedConversation?.conversationId === conv.conversationId
          "
          (click)="selectConversation(conv)"
        >
          <div class="chat-avatar">
            <img
              *ngIf="conv.profilePhotoUrl"
              [src]="'http://localhost:8002' + conv.profilePhotoUrl"
              [alt]="conv.otherUsername"
              style="
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 50%;
              "
            />
            <span *ngIf="!conv.profilePhotoUrl">
              {{ conv.otherUsername[0].toUpperCase() }}
            </span>
          </div>
          <div class="conversation-info">
    <div class="conversation-info-header">
        <span class="chat-username">{{ "@" + conv.otherUsername }}</span>
        <button 
            *ngIf="conv.otherUserId"
            (click)="goToProfile(conv); $event.stopPropagation()"
            mat-mini-fab
            color="primary"
            matTooltip="Ver perfil"
            class="btn-profile-small">
            <mat-icon>person</mat-icon>
        </button>
    </div>
    <span class="chat-last-message">{{ conv.lastMessage }}</span>
</div>
        </div>

        <div *ngIf="conversations.length === 0" class="chat-empty-state">
          No tenés conversaciones aún.
        </div>
      </div>

      <div class="chat-panel">
        <ng-container *ngIf="selectedConversation; else noSelection">
          <div class="chat-header">
            <span>{{ "@" + selectedConversation.otherUsername }}</span>
          </div>

          <div class="messages-list">
            <div
              *ngFor="let msg of messages"
              class="message-bubble"
              [class.sent]="msg.senderId === currentUsername"
              [class.received]="msg.senderId !== currentUsername"
            >
              <span>{{ msg.body }}</span>
            </div>
          </div>

          <div class="chat-input-row">
            <input
              [(ngModel)]="newMessage"
              placeholder="Escribe un mensaje..."
              (keyup.enter)="sendMessage()"
            />
            <button (click)="sendMessage()">Enviar</button>
          </div>
        </ng-container>

        <ng-template #noSelection>
          <div class="chat-no-selection">
            <p>Seleccioná una conversación para comenzar</p>
          </div>
        </ng-template>
      </div>
    </div>
  </div>
</div>
