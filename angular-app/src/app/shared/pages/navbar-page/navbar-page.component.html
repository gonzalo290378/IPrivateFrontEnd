@if(isLogged){
<mat-sidenav-container>
  <div class="flex flex-center">
    <button mat-button mat-raised color="primary">
      <mat-icon>account_circle</mat-icon> {{ userProfile?.username }}

      <span
        class="status-text"
        [ngClass]="{ 'active-status': isLogged, 'inactive-status': !isLogged }"
      >
        {{ isLogged ? "Sin notificaciones" : "Notificaciones" }}
      </span>
    </button>
  </div>

  <mat-nav-list class="flex-container">
    <a mat-list-item [routerLink]="['/']">
      <span class="entry">
        <mat-icon class="icon">house</mat-icon>
        <span class="text">Inicio</span>
      </span>
    </a>

    <a mat-list-item [routerLink]="['/', 'username', 'messages']">
      <span class="entry">
        <mat-icon class="icon">chat</mat-icon>
        <span class="text">Mis Mensajes</span>
      </span>
    </a>

     <a mat-list-item [routerLink]="['/', 'username', 'messages']">
      <span class="entry">
        <mat-icon class="icon">chat</mat-icon>
        <span class="text">Mis favoritos</span>
      </span>
    </a>

    <a mat-list-item [routerLink]="['/', 'username', 'suscriptions']">
      <span class="entry">
        <mat-icon class="icon">house</mat-icon>
        <span class="text">Suscripciones</span>
      </span>
    </a>

    <a mat-list-item [routerLink]="['/edit', userProfile?.username]">
      <span class="entry">
        <mat-icon class="icon">settings</mat-icon>
        <span class="text">Mi Perfil Publico</span>
      </span>
    </a>
  </mat-nav-list>
</mat-sidenav-container>
}

<app-filter-page></app-filter-page>
